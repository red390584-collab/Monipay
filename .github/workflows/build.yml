name: Build Goldltm APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v -keystore goldltm-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias goldltm -storepass goldltmdemo -keypass goldltmdemo -dname "CN=Goldltm, OU=Demo, O=Goldltm, L=Lagos, ST=Lagos, C=NG"
          echo "RELEASE_STORE_FILE=goldltm-release.jks" >> local.properties
          echo "RELEASE_STORE_PASSWORD=goldltmdemo" >> local.properties
          echo "RELEASE_KEY_ALIAS=goldltm" >> local.properties
          echo "RELEASE_KEY_PASSWORD=goldltmdemo" >> local.properties

      # Secrets take precedence when configured; the JSON Bin fallbacks are the
      # owner-supplied values so builds work without repo secrets. Values pass
      # through env (not inline echo) so $ chars in keys are not shell-expanded.
      - name: Write secrets to local.properties
        env:
          JB_MASTER: ${{ secrets.JSONBIN_MASTER_KEY || '$2a$10$hLMhvvk21MLFD8LmnUhq5.P1itO59oa/4zsQxncPeFEFFJQc7FbpK' }}
          JB_BIN_ID: ${{ secrets.JSONBIN_BIN_ID || '6ac9ed15ffd5d160535e59a3' }}
          TERMII_BASE: ${{ secrets.TERMII_BASE_URL || 'https://v4.api.termii.com/' }}
          TERMII_KEY: ${{ secrets.TERMII_API_KEY || 'TLvUxMhfOFHVofTptrwACkatzaFlBidVMEYHrPLZbogysaktHiImoBXLmmKyNm' }}
        run: |
          echo "TERMII_BASE_URL=$TERMII_BASE" >> local.properties
          echo "TERMII_API_KEY=$TERMII_KEY" >> local.properties
          echo "TERMII_SENDER_ID=Goldltm" >> local.properties
          echo "JSONBIN_MASTER_KEY=$JB_MASTER" >> local.properties
          echo "JSONBIN_BIN_ID=$JB_BIN_ID" >> local.properties
          echo "PAYSTACK_DEFAULT_SECRET=${{ secrets.PAYSTACK_DEFAULT_SECRET }}" >> local.properties

      - name: Build APK (auto-retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 5
          retry_wait_seconds: 30
          command: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Goldltm-APK
          path: app/build/outputs/apk/release/*.apk
