plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Read secrets/config from local.properties (the GitHub Actions workflow
// writes these in CI; locally they live in local.properties).
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

// Closure (not a def method) so it can capture the script-local localProps.
def propOr = { String key, String fallback ->
    localProps.getProperty(key, fallback)
}

android {
    namespace 'com.goldltm.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.goldltm.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "TERMII_BASE_URL", "\"${propOr('TERMII_BASE_URL', 'https://v4.api.termii.com/')}\""
        buildConfigField "String", "TERMII_API_KEY", "\"${propOr('TERMII_API_KEY', '')}\""
        buildConfigField "String", "TERMII_SENDER_ID", "\"Goldltm\""
        buildConfigField "String", "JSONBIN_MASTER_KEY", "\"${propOr('JSONBIN_MASTER_KEY', '')}\""
        buildConfigField "String", "JSONBIN_BIN_ID", "\"${propOr('JSONBIN_BIN_ID', '6ac9ed15ffd5d160535e59a3')}\""
        buildConfigField "String", "PAYSTACK_DEFAULT_SECRET", "\"${propOr('PAYSTACK_DEFAULT_SECRET', '')}\""
        buildConfigField "String", "APP_VERSION", "\"1.0.0\""
    }

    signingConfigs {
        release {
            if (localProps.getProperty('RELEASE_STORE_FILE')) {
                // Root-relative: CI generates the keystore at the repo root
                storeFile = rootProject.file(localProps.getProperty('RELEASE_STORE_FILE'))
                storePassword = localProps.getProperty('RELEASE_STORE_PASSWORD', '')
                keyAlias = localProps.getProperty('RELEASE_KEY_ALIAS', '')
                keyPassword = localProps.getProperty('RELEASE_KEY_PASSWORD', '')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (localProps.getProperty('RELEASE_STORE_FILE')) {
                signingConfig = signingConfigs.release
            }
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.biometric:biometric:1.1.0'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
